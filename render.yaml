services:
  - type: web
    name: creator-os-telegram
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    # Build the tracked source directly. The previous command unzipped
    # creator-os-render-ready.zip, which is not in this repository, so the
    # build failed before it started.
    buildCommand: npm ci && npm run build
    # `start:render` lets Next bind the port Render injects via PORT. The local
    # `start` script pins 3100, which would never match Render's dynamic port.
    startCommand: npm run start:render
    numInstances: 1
    disk:
      name: creator-os-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PILOT_HOSTED
        value: "true"
      - key: PILOT_DB_PATH
        value: /var/data/pilot.sqlite
      - key: PILOT_TELEGRAM_SEND_ENABLED
        # Enabled for this private pilot by explicit owner authorisation, so the
        # doorway can actually reply. Without it the bot receives updates and
        # only logs the would-be answer. This authorises Telegram alone: no
        # social publishing is turned on here, and the daily pulse below is not
        # implemented in any running code path, so those two values are inert.
        value: "true"
      - key: PILOT_TELEGRAM_TIMEZONE
        value: Europe/London
      - key: PILOT_TELEGRAM_DAILY_HOUR
        value: "9"
      - key: PILOT_TELEGRAM_DAILY_MINUTE
        value: "0"
      - key: PILOT_APP_URL
        sync: false
      - key: AI_PROVIDER
        value: openai-compatible
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: PILOT_TELEGRAM_BOT_TOKEN
        sync: false
      - key: PILOT_TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: PILOT_TELEGRAM_BOT_USERNAME
        sync: false
